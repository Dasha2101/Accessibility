name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest


    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/Accessibility
            git fetch origin
            git reset --hard origin/main
            docker-compose down --remove-orphans
            docker-compose up -d --build